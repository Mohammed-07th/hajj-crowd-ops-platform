# Infrastructure for hajj-crowd-ops-platform.
#
# Deliberately minimal: only the two services that are *graded infrastructure*
# run in containers.
#   - Kafka  -> Deliverable 1 requires a real broker (no queue simulation).
#   - Qdrant -> Deliverable 3 requires a real vector store (no numpy brute force).
#
# Airflow runs on the host (`airflow standalone`) and lineage is emitted to a
# file transport rather than Marquez, to keep this build inside a 5 GB Docker
# allocation on a 16 GB fanless laptop. Both remain real components; see
# docs/ARCHITECTURE.md for the reasoning.

services:
  kafka:
    # KRaft mode - single node, no Zookeeper. One container instead of two.
    image: apache/kafka:3.8.1
    container_name: hajj-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Clients all live on the host and reach the broker through the mapped
      # port, so the advertised listener must be the host-visible address.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: every internal topic must be replication-factor 1 or the
      # broker refuses to create them.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-create is OFF: topics are created explicitly by
      # scripts/create_topics.sh so partition counts are deterministic and a
      # typo in a topic name fails loudly instead of silently creating a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms512M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 2g

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: hajj-qdrant
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 1g

volumes:
  qdrant_storage:
